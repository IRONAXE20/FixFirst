# Washing machine (Whirlpool only): RentBasket Service Knowledge Base v1, WM-01 to WM-05.
# ACTION = TICKET issues get a ticket at once; WM-01 (inlet valve filter blocked) is the KB's self-fix.
# Safety is caught on every turn by the hazard screen. The spoken wording still needs RentBasket's sign-off.
id: washer_problem
appliance: washer
title: {en: "Washing machine problem (RentBasket KB WM-01 to WM-05)", hi: "Washing machine की problem (RentBasket KB WM-01 से WM-05)"}
status: draft-unreviewed
reviewed_by: null
entry: triage
triage_node: triage
nodes:
  triage:
    say:
      en: "Please tell me what's wrong with the washing machine."
      hi: "बताइए, washing machine में क्या problem है?"
    outcomes:
      not_filling: {next: wm01_off, label: "WM-01 Water not coming in (water not filling, paani nahi aa raha, machine mein paani nahi bhar raha)"}
      pipe_broken: {next: esc_wm02, label: "WM-02 Inlet or outlet pipe broken (pipe toot gaya, pipe broken, pipe se paani nikal raha hai)"}
      not_washing: {next: esc_wm03, label: "WM-03 Clothes not washed properly (kapde saaf nahi ho rahe, clothes still dirty)"}
      stops_midway: {next: esc_wm04, label: "WM-04 Machine stops while running (beech mein band ho jaati hai, stops mid-cycle)"}
      leak: {next: wm05_plug, label: "WM-05 Water leaking from the machine (water leaking, machine se paani leak ho raha hai)"}
      other: {next: esc_other, label: "Something else not listed here"}
    sources: [rentbasket_kb]

  # ---- WM-01 water not coming in: self-fix (the inlet valve filter is blocked) ----------
  wm01_off:
    say:
      en: "This is usually a blocked filter where the water pipe joins the machine, and we can clean it. First, please switch off the machine and close its water tap. Tell me when done."
      hi: "ऐसा आमतौर पर machine में पानी का pipe जहाँ जुड़ता है, वहाँ की filter बंद होने से होता है, और इसे साफ़ किया जा सकता है। पहले machine बंद कीजिए और उसका पानी का नल बंद कर दीजिए। हो जाए तो बताइए।"
    outcomes:
      done: {next: wm01_unscrew, label: "Machine off, tap closed"}
      cant_do: {next: esc_wm01, label: "Can't do it"}
    sources: [rentbasket_kb]

  wm01_unscrew:
    say:
      en: "Now unscrew the inlet pipe from the back of the machine, the pipe that brings water from the tap. Tell me when it's off."
      hi: "अब machine के पीछे से inlet pipe, यानी नल से पानी लाने वाला pipe, घुमा कर खोल दीजिए। खुल जाए तो बताइए।"
    outcomes:
      done: {next: wm01_filter, label: "Inlet pipe unscrewed"}
      later: {next: followup, label: "Will do it later"}
      cant_do: {next: esc_wm01, label: "Can't unscrew it or reach it"}
    sources: [rentbasket_kb]

  wm01_filter:
    say:
      en: "Inside the inlet there's a small mesh filter. Please pull it out and clean it under running water. Tell me when it's clean."
      hi: "Inlet के अंदर एक छोटी जाली वाली filter होती है। उसे बाहर निकालिए और बहते पानी में साफ़ कर लीजिए। साफ़ हो जाए तो बताइए।"
    outcomes:
      done: {next: wm01_refit, label: "Filter cleaned"}
      later: {next: followup, label: "Will do it later"}
      cant_do: {next: esc_wm01, label: "Can't find it or take it out"}
    sources: [rentbasket_kb]

  wm01_refit:
    say:
      en: "Now fit the filter and the pipe back, open the tap, and start the machine. Did it work? Is water coming in now?"
      hi: "अब filter और pipe वापस लगाइए, नल खोलिए, और machine चलाइए। क्या इससे ठीक हुआ? क्या अब पानी आ रहा है?"
    outcomes:
      fixed: {next: resolved, label: "Yes, water is coming in"}
      not_fixed: {next: esc_wm01, label: "No, still no water"}
      pipe_leaks: {next: esc_wm02, label: "The pipe leaks after fitting it back"}
    sources: [rentbasket_kb]

  # ---- WM-05 leaking: ticket, after the plug question ----------------------------------
  wm05_plug:
    say:
      en: "Is the water near the plug or socket?"
      hi: "क्या पानी plug या socket के पास है?"
    outcomes:
      near_plug: {hazard: water_electric, label: "Yes, near the plug or socket"}
      not_near: {next: esc_wm05, label: "No, away from the plug"}
    sources: [rentbasket_kb]

  # ---- endings -----------------------------------------------------------------------
  resolved:
    kind: resolve
    resolution: fixed_on_call
    say:
      en: "Great, the machine is working properly again. If the problem comes back, please call us."
      hi: "बहुत बढ़िया, machine फिर से ठीक चल रही है। अगर problem फिर आए, तो हमें call कीजिए।"

  followup:
    kind: followup
    followup_minutes: 60
    say:
      en: "No problem. I'll message you on WhatsApp in about an hour. If water still doesn't come in after you clean the filter, just reply and I'll raise a ticket."
      hi: "कोई बात नहीं। मैं लगभग एक घंटे में WhatsApp पर message करूँगी। अगर filter साफ़ करने के बाद भी पानी न आए, तो बस reply कर दीजिए, मैं ticket raise कर दूँगी।"

  esc_wm01:
    kind: escalate
    likely_cause: "WM-01 Water not coming in: inlet valve filter blocked; self-fix not done or didn't help (RentBasket KB)"
    technician_note: "Clean or replace the inlet filter; check the inlet valve."
  esc_wm02:
    kind: escalate
    likely_cause: "WM-02 Inlet or outlet pipe broken (RentBasket KB: ticket)"
    technician_note: "Carry inlet and outlet pipes for this Whirlpool model."
  esc_wm03:
    kind: escalate
    likely_cause: "WM-03 Clothes not washed properly (RentBasket KB: ticket)"
    technician_note: "Check agitator/drum movement, water level and drain."
  esc_wm04:
    kind: escalate
    likely_cause: "WM-04 Machine stops while running (RentBasket KB: ticket)"
    technician_note: "Check error history, lid lock, motor and power supply."
  esc_wm05:
    kind: escalate
    likely_cause: "WM-05 Water leaking from the machine, not near the plug (RentBasket KB: ticket)"
    technician_note: "Find the leak: hoses, seals, tub."
  esc_other:
    kind: escalate
    likely_cause: "Washing machine issue not in the RentBasket KB (see the caller's words)"
    technician_note: "Call the customer to understand the problem before the visit."
