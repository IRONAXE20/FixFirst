# Fridge (Whirlpool / Lloyd): RentBasket Service Knowledge Base v1, FR-01 to FR-05.
# ACTION = TICKET issues get a ticket at once. FR-04 (front leak, choked front drain duct) is the KB's
# self-fix; it takes 12 hours, so after the plug question its steps go on WhatsApp (template T2), as the
# Customer Service Ecosystem call script says. An issue the KB doesn't list goes to a person.
# Safety is caught on every turn by the hazard screen. The spoken wording still needs RentBasket's sign-off.
id: fridge_not_cooling
appliance: fridge
title: {en: "Fridge problem (RentBasket KB FR-01 to FR-05)", hi: "Fridge की problem (RentBasket KB FR-01 से FR-05)"}
status: draft-unreviewed
reviewed_by: null
entry: triage
triage_node: triage
nodes:
  triage:
    say:
      en: "Please tell me a little about the problem. What's happening with the fridge?"
      hi: "Fridge की problem थोड़ा बता दीजिए, क्या हो रहा है?"
    outcomes:
      not_cooling: {next: esc_fr01, label: "FR-01 Not cooling (not cooling, thanda nahi kar raha, food getting spoiled)"}
      ice_not_freezing: {next: esc_fr02, label: "FR-02 Ice not freezing (ice not forming, baraf nahi jam rahi, freezer not cold)"}
      bulb: {next: esc_fr03, label: "FR-03 Bulb not working (light not working, bulb band hai, andar light nahi jal rahi)"}
      leak_front: {next: fr04_plug, label: "FR-04 Water leaking from the front (water coming from the front, aage se paani aa raha hai, paani neeche gir raha hai)"}
      leak_back: {next: esc_fr05, label: "FR-05 Water leaking from the back (water coming from the back, peeche se paani aa raha hai)"}
      other: {next: esc_other, label: "Something else not listed here"}
    sources: [rentbasket_kb]

  # ---- FR-04 front leak: self-fix on WhatsApp (12 hours) --------------------------------
  fr04_plug:
    say:
      en: "First, is the water near the fridge's plug or socket?"
      hi: "पहले बताइए, क्या पानी fridge के plug या socket के पास है?"
    outcomes:
      near_plug: {hazard: water_electric, label: "Yes, near the plug or socket"}
      not_near: {next: steps_on_whatsapp, label: "No, away from the plug"}
    sources: [rentbasket_kb]

  # ---- endings -----------------------------------------------------------------------
  steps_on_whatsapp:
    kind: followup
    followup_minutes: 780
    whatsapp: FR-04
    say:
      en: "This usually happens when the small drain inside gets blocked, and it can be fixed at home, but it takes 12 hours. I'm sending you the steps on WhatsApp. When it's done, just tap 'Yes' there."
      hi: "ऐसा आमतौर पर अंदर की छोटी drain बंद होने से होता है, और ये घर पर ही ठीक हो जाता है, पर इसमें 12 घंटे लगते हैं। मैं ये steps आपको WhatsApp पर भेज रही हूँ। काम हो जाए तो वहाँ 'Yes' दबा दीजिए।"

  esc_fr01:
    kind: escalate
    likely_cause: "FR-01 Not cooling (RentBasket KB: ticket)"
    technician_note: "Diagnose cooling on site. Gas work only by a qualified, equipped technician (Pankaj, Manoj or another approved partner; not Digamber)."
  esc_fr02:
    kind: escalate
    likely_cause: "FR-02 Ice not freezing (RentBasket KB: ticket)"
    technician_note: "Check freezer cooling and thermostat."
  esc_fr03:
    kind: escalate
    likely_cause: "FR-03 Bulb not working (RentBasket KB: ticket)"
    technician_note: "Carry a bulb for this model."
  esc_fr05:
    kind: escalate
    likely_cause: "FR-05 Water leaking from the back (RentBasket KB: ticket)"
    technician_note: "Check the rear drain tray and connections."
  esc_other:
    kind: escalate
    handoff: true
    likely_cause: "Fridge issue not in the RentBasket KB (see the caller's words)"
    technician_note: "Call the customer to understand the problem before the visit."
