# AC (Lloyd / Voltas): RentBasket Service Knowledge Base v1 (knowledge/sop/RentBasket_Issue_KB.md), AC-01 to AC-04,
# spoken as in RentBasket's Customer Service Ecosystem call script (29 Oct 2026).
#
# How playbooks work: the agent speaks each node's `say` text word for word and the LLM
# only classifies the caller's answer into one of the node's `outcomes`. The server rejects
# any transition that isn't listed, so the agent cannot give an instruction that isn't here.
#
# The KB decides: ACTION = TICKET issues get a ticket at once, with no fix suggested; ACTION = SELF-FIX
# issues start with "are you near the AC?" (if not, the steps go on WhatsApp, template T2), then one step at
# a time, ending with "is it working now?", and get a ticket if not. Triage labels carry the KB's "Customer
# says" words. An issue the KB doesn't list goes to a person (`handoff`). Safety (smoke, sparks, burning
# smell, shock, water near a plug) is caught on every turn by the hazard screen before any step.
# The spoken wording is FixFirst's and still needs RentBasket's sign-off.
id: ac_not_cooling
appliance: ac
title: {en: "AC problem (RentBasket KB AC-01 to AC-04)", hi: "AC की problem (RentBasket KB AC-01 से AC-04)"}
status: draft-unreviewed       # set to "reviewed" once RentBasket signs off the spoken wording
reviewed_by: null
entry: triage
triage_node: triage
nodes:
  triage:
    say:
      en: "Please tell me a little about the problem. What's happening with the AC?"
      hi: "AC की problem थोड़ा बता दीजिए, क्या हो रहा है?"
    outcomes:
      not_cooling: {next: esc_ac01, label: "AC-01 Not cooling (not cooling, cooling kam hai, thanda nahi kar raha, garam hawa)"}
      compressor: {next: esc_ac02, label: "AC-02 Compressor or outdoor unit not running (compressor not starting, outdoor unit not running, bahar wala unit band hai)"}
      power: {next: ac03_socket, label: "AC-03 Not turning on, plug or socket problem (AC not turning on, socket problem, plug problem, light nahi aa rahi, socket jal gaya)"}
      weak_airflow: {next: ac04_near, label: "AC-04 Weak airflow, filter blocked (hawa kam aa rahi hai, low air, filter jaam, dust)"}
      other: {next: esc_other, label: "Something else not listed here"}
    sources: [rentbasket_kb]

  # ---- AC-03 power, plug or socket: safety check, then ticket -----------------------
  ac03_socket:
    say:
      en: "Is the socket or plug burnt or black?"
      hi: "क्या socket जला हुआ या काला है?"
    outcomes:
      burnt: {hazard: electrical, label: "Yes, burnt or black"}
      not_burnt: {next: ac03_wire, label: "No"}
    sources: [rentbasket_kb]

  ac03_wire:
    say:
      en: "Is the wire damaged, or has there been a short circuit?"
      hi: "क्या wire damage है या short circuit हुआ है?"
    outcomes:
      damaged: {hazard: electrical, label: "Yes, damaged wire or a short circuit"}
      not_damaged: {next: esc_ac03, label: "No"}
    sources: [rentbasket_kb]

  # ---- AC-04 filter blocked: self-fix ------------------------------------------------
  ac04_near:
    say:
      en: "This can often be fixed at home. I'll take you through it step by step. Are you near the AC right now?"
      hi: "ये अक्सर घर पर ही ठीक हो जाता है। मैं आपको step by step बताती हूँ। क्या आप अभी AC के पास हैं?"
    outcomes:
      near: {next: ac04_off, label: "Yes, near the AC now"}
      not_near: {next: steps_on_whatsapp, label: "Not near it, or would rather do it later"}
    sources: [rentbasket_kb]

  ac04_off:
    say:
      en: "First, please switch off the AC from the remote and then at the wall switch. Tell me when it's off."
      hi: "पहले remote से AC बंद कीजिए, और फिर wall switch से। बंद हो जाए तो बताइए।"
    outcomes:
      done: {next: ac04_filters, label: "AC is off at the remote and the wall"}
      cant_do: {next: esc_ac04, label: "Can't do it"}
    sources: [rentbasket_kb]

  ac04_filters:
    say:
      en: "Now open the front panel of the indoor unit and gently slide out the filters. Tell me when they're out."
      hi: "अब indoor unit का front panel खोलिए और filters को धीरे से बाहर निकालिए। निकल जाएँ तो बताइए।"
    help:
      en: "The filters are thin plastic mesh sheets right behind the front panel. Lift the panel from the bottom edge until it stays open."
      hi: "Filters front panel के ठीक पीछे लगी पतली plastic की जाली होती हैं। Panel को नीचे के किनारे से उठाइए जब तक वो खुला न रुक जाए।"
    outcomes:
      done: {next: ac04_wash, label: "Filters are out (or already out and being washed)"}
      later: {next: steps_on_whatsapp, label: "Will do it later"}
      cant_do: {next: esc_ac04, label: "Can't open the panel or reach the filters"}
    sources: [rentbasket_kb]

  ac04_wash:
    say:
      en: "Please wash them with plain water and let them dry fully. Tell me when they're dry, or if you'd like to finish later."
      hi: "इन्हें सादे पानी से धो लीजिए और पूरी तरह सूखने दीजिए। सूख जाएँ तो बताइए, या बाद में करना हो तो वो भी बताइए।"
    outcomes:
      done: {next: ac04_refit, label: "Washed and dry"}
      later: {next: steps_on_whatsapp, label: "Drying; will finish later"}
    sources: [rentbasket_kb]

  ac04_refit:
    say:
      en: "Now put the filters back, close the panel, and switch the AC on. Is it working properly now?"
      hi: "अब filters वापस लगाइए, panel बंद कीजिए, और AC on कीजिए। क्या अब ठीक चल रहा है?"
    outcomes:
      fixed: {next: resolved, label: "Yes, the airflow is fine now"}
      not_fixed: {next: esc_ac04, label: "No, still weak"}
      partly: {next: partial_ac04, label: "Better, but the airflow is still not normal"}
    sources: [rentbasket_kb]

  # ---- endings -----------------------------------------------------------------------
  resolved:
    kind: resolve
    resolution: fixed_on_call
    say:
      en: "Great! I'm closing the ticket. We'll check with you on WhatsApp tomorrow."
      hi: "बहुत बढ़िया! मैं ticket close कर रही हूँ। कल हम WhatsApp पर check करेंगे।"
  steps_on_whatsapp:
    kind: followup
    followup_minutes: 1440
    whatsapp: AC-04
    say:
      en: "I'm sending you these steps on WhatsApp. When it's done, just tap 'Yes' there."
      hi: "मैं ये steps आपको WhatsApp पर भेज रही हूँ। काम हो जाए तो वहाँ 'Yes' दबा दीजिए।"

  esc_ac01:
    kind: escalate
    likely_cause: "AC-01 Not cooling (RentBasket KB: ticket)"
    technician_note: "Diagnose cooling on site. Refrigerant work only by a qualified, equipped technician (Pankaj, Manoj or another approved partner; not Digamber)."
  esc_ac02:
    kind: escalate
    likely_cause: "AC-02 Compressor issue: outdoor unit not running (RentBasket KB: ticket)"
    technician_note: "Check compressor, capacitor and outdoor fan. Gas work only by a qualified technician (not Digamber)."
  esc_ac03:
    kind: escalate
    likely_cause: "AC-03 Not turning on: power, plug or socket problem; socket not burnt, wire not damaged (RentBasket KB: ticket)"
    technician_note: "Check socket, plug, wiring and the AC's power supply."
  partial_ac04:
    kind: escalate
    partial: true
    likely_cause: "AC-04 Weak airflow: filters cleaned on the call, airflow better but not normal (RentBasket KB)"
    technician_note: "Filters already cleaned by the customer. Check blower and coil."
  esc_ac04:
    kind: escalate
    likely_cause: "AC-04 Weak airflow: filter blocked; self-fix not done or didn't help (RentBasket KB)"
    technician_note: "Clean filters and check blower and coil."
  esc_other:
    kind: escalate
    handoff: true
    likely_cause: "AC issue not in the RentBasket KB (see the caller's words)"
    technician_note: "Call the customer to understand the problem before the visit."
