# Microwave (Haier / Panasonic / Midea): RentBasket Service Knowledge Base v1, MW-01 to MW-04.
# MW-01 (sparking and noise) is a stop-use safety case with an URGENT ticket; MW-02 and MW-03 are always a
# ticket (the customer must never open it); MW-04 (bad smell, inside not cleaned) is the KB's self-fix.
# The spoken wording still needs RentBasket's sign-off.
id: microwave_problem
appliance: microwave
title: {en: "Microwave problem (RentBasket KB MW-01 to MW-04)", hi: "Microwave की problem (RentBasket KB MW-01 से MW-04)"}
status: draft-unreviewed
reviewed_by: null
entry: triage
triage_node: triage
nodes:
  triage:
    say:
      en: "Please tell me what's wrong with the microwave."
      hi: "बताइए, microwave में क्या problem है?"
    outcomes:
      sparking_noise: {hazard: stop_use, label: "MW-01 Sparking and noise (sparking, chingari, awaaz aa rahi hai, loud noise)"}
      not_heating: {next: esc_mw02, label: "MW-02 Not heating (garam nahi kar raha, not heating, food stays cold)"}
      no_power: {next: esc_mw03, label: "MW-03 Turns on but doesn't work, or no power (chal raha hai par garam nahi, dead, on nahi ho raha)"}
      bad_smell: {next: mw04_kind, label: "MW-04 Bad smell (smell aa rahi hai, badboo, bad smell)"}
      other: {next: esc_other, label: "Something else not listed here"}
    sources: [rentbasket_kb]

  # ---- MW-04 bad smell: self-fix (the inside hasn't been cleaned) ----------------------
  mw04_kind:
    say:
      en: "Does it smell like something burning, or more like old food?"
      hi: "क्या smell किसी चीज़ के जलने जैसी है, या पुराने खाने जैसी?"
    outcomes:
      burning: {hazard: stop_use, label: "Like burning (treated as MW-01)"}
      food: {next: mw04_unplug, label: "Like old food"}
    sources: [rentbasket_kb]

  mw04_unplug:
    say:
      en: "That usually means the inside needs a clean. Please switch off the microwave and unplug it. Tell me when done."
      hi: "इसका मतलब आमतौर पर अंदर सफ़ाई की ज़रूरत है। कृपया microwave बंद कीजिए और उसका plug निकाल दीजिए। हो जाए तो बताइए।"
    outcomes:
      done: {next: mw04_wipe, label: "Switched off and unplugged"}
      cant_do: {next: esc_mw04, label: "Can't do it"}
    sources: [rentbasket_kb]

  mw04_wipe:
    say:
      en: "Now wipe the inside walls, the door and the turntable with a damp cloth. If you like, you can also heat a bowl of water with some lemon for three minutes and wipe again. Did it work? Is the smell gone?"
      hi: "अब अंदर की दीवारें, door और घूमने वाली plate गीले कपड़े से पोंछ दीजिए। चाहें तो एक bowl पानी में नींबू डाल कर तीन मिनट गरम कीजिए और फिर से पोंछ लीजिए। क्या इससे ठीक हुआ? क्या smell चली गई?"
    outcomes:
      fixed: {next: resolved, label: "Yes, the smell is gone"}
      not_fixed: {next: esc_mw04, label: "No, it still smells"}
      later: {next: followup, label: "Will clean it later"}
    sources: [rentbasket_kb]

  # ---- endings -----------------------------------------------------------------------
  resolved:
    kind: resolve
    resolution: fixed_on_call
    say:
      en: "Great, the microwave is fine again. If the problem comes back, please call us."
      hi: "बहुत बढ़िया, microwave फिर से ठीक है। अगर problem फिर आए, तो हमें call कीजिए।"
  followup:
    kind: followup
    followup_minutes: 60
    say:
      en: "No problem. I'll message you on WhatsApp in about an hour. If it still smells after cleaning, just reply and I'll raise a ticket."
      hi: "कोई बात नहीं। मैं लगभग एक घंटे में WhatsApp पर message करूँगी। अगर साफ़ करने के बाद भी smell आए, तो बस reply कर दीजिए, मैं ticket raise कर दूँगी।"

  esc_mw02:
    kind: escalate
    say:
      en: "Please don't open the microwave."
      hi: "कृपया microwave को खोलिए मत।"
    likely_cause: "MW-02 Not heating: likely magnetron (RentBasket KB: always a ticket)"
    technician_note: "Microwave service: magnetron. High voltage; on-site or workshop only."
  esc_mw03:
    kind: escalate
    say:
      en: "Please don't open the microwave."
      hi: "कृपया microwave को खोलिए मत।"
    likely_cause: "MW-03 Turns on but doesn't work, or no power: likely capacitor (RentBasket KB: ticket; customer must never open it)"
    technician_note: "Microwave service: capacitor and power circuit. High voltage."
  esc_mw04:
    kind: escalate
    likely_cause: "MW-04 Bad smell; cleaning not done or didn't help (RentBasket KB)"
    technician_note: "Check for burnt residue or an electrical smell."
  esc_other:
    kind: escalate
    likely_cause: "Microwave issue not in the RentBasket KB (see the caller's words)"
    technician_note: "Call the customer to understand the problem before the visit."
