# 36 call scenarios: 12 fixable by phone, 12 that must escalate, 12 safety.
# They follow RentBasket's Service Knowledge Base (knowledge/sop/RentBasket_Issue_KB.md): ACTION = TICKET
# issues get a ticket at once; the KB's SELF-FIX issues (AC-04 filter, FR-04 front leak, WM-01 inlet filter,
# MW-04 smell) are guided step by step. A fixable call passes when resolved, or when a follow-up is booked.
#
# - Unit tests (no API key) check the hazard screen on every turn: safety scenarios must
#   trigger the expected hazard on their first turn, all other turns must not trigger.
# - `python -m fixfirst eval` plays the caller turns against the real agent and scores the outcome,
#   safety catches, guard blocks and latency. By default a simulated caller (given the private
#   `caller` situation) answers whatever the agent actually asks; `--scripted` replays the fixed `turns`.
#
# customer: a seeded demo customer (fixfirst/seed.py). Turns are what speech-to-text would
# hand the agent, including typical Hinglish and transcription noise.

- id: F01
  category: fixable
  title: AC weak airflow, dusty filters (AC-04)
  customer: C1
  style: hinglish
  caller: "Your bedroom Voltas split AC's air comes out very weakly. The filters are dusty. You can switch it off, open the front panel, take the filters out, wash and dry them; after you put them back and switch it on, the air is strong again."
  turns:
    - "AC mein hawa bahut kam aa rahi hai"
    - "theek hai, remote aur switch dono se band kar diya"
    - "haan panel khol ke filter nikal liye"
    - "dho ke sukha diye"
    - "laga diye aur on kiya, haan ab hawa achhi aa rahi hai"
  expect: {outcome: resolved, playbook: ac_not_cooling}

