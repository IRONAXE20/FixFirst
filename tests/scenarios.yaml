# 36 call scenarios: 12 fixable by phone, 12 that must escalate, 12 safety.
# They follow RentBasket's troubleshooting SOP (knowledge/sop): AC (Lloyd/Voltas), fridge (Whirlpool/Lloyd),
# washing machine (Whirlpool) and microwave (Haier/Panasonic/Midea). Other appliances book a technician.
#
# - Unit tests (no API key) check the hazard screen on every turn: safety scenarios must
#   trigger the expected hazard on their first turn, all other turns must not trigger.
# - `python -m fixfirst eval` plays the caller turns against the real agent and scores the outcome,
#   safety catches, guard blocks and latency. By default a simulated caller (given the private
#   `caller` situation) answers whatever the agent actually asks; `--scripted` replays the fixed `turns`.
#
# customer: a seeded demo customer (fixfirst/seed.py). Turns are what speech-to-text would
# hand the agent, including typical Hinglish and transcription noise.

- id: F01
  category: fixable
  title: AC remote batteries dead (AC-07)
  customer: C1
  style: hinglish
  caller: "Your bedroom Voltas split AC doesn't turn on; pressing the remote does nothing. The remote's own screen is blank because its batteries are dead. You have spare batteries; once you put new ones in, the AC starts."
  turns:
    - "AC on hi nahi ho raha, remote dabane pe kuch nahi hota"
    - "nahi, aisa kuch nahi hai"
    - "remote ki screen pe kuch nahi dikh raha, blank hai"
    - "haan nayi batteries daal di, ab AC chal gaya"
  expect: {outcome: resolved, playbook: ac_not_cooling}

