<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FixFirst Knowledge</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .pb-list { display: grid; gap: 8px; padding: 12px; }
    .pb-item { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
    .pb-item.on { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .pb-item .t { font-weight: 650; }
    .side-links { display: grid; gap: 6px; padding: 0 12px 12px; }
    .node { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
    .node + .node { margin-top: 10px; }
    .node-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .node-id { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; font-weight: 650; }
    .say { margin-top: 8px; display: grid; gap: 6px; font-size: 14.5px; }
    .say .lang { font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 6px; }
    .outs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .out { font-size: 12.5px; padding: 3px 9px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
    .out a { text-decoration: none; }
    .out.hz { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
    .srcs { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
    .term { font-size: 13px; margin-top: 6px; color: var(--ink-2); }
    .doc-hit { border-top: 1px solid var(--line); padding: 10px 0; }
    .doc-hit:first-child { border-top: 0; }
    .doc-hit p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
    .row { display: flex; gap: 8px; align-items: center; }
    .script { font-size: 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark" id="logo"></span><span class="brand-name">FixFirst</span><span class="brand-tenant" data-tenant></span></a>
    <span class="chip" id="status-chip"><span class="dot"></span>…</span>
    <nav class="nav"><a href="/" data-page="call">Call</a><a href="/ops" data-page="ops">Ops</a><a href="/knowledge" data-page="knowledge">Knowledge</a></nav>
  </div></header>
  <main class="page stack">
    <div class="banner info"><span>ℹ️</span><span><b>Every instruction the agent speaks is on this page.</b> The agent reads these steps word for word; the model only picks which answer the caller gave. All playbooks are drafts until RentBasket's senior technician reviews them (set <span class="mono">status: reviewed</span> in the YAML).</span></div>
    <div class="grid">
      <aside class="card">
        <div class="card-head"><h2>Playbooks</h2></div>
        <div class="pb-list" id="pb-list"></div>
        <div class="side-links"><button class="btn ghost" id="show-safety">⚠️ Safety scripts</button><button class="btn ghost" id="show-docs">📚 Document library</button></div>
      </aside>
      <section class="card card-pad" id="main"></section>
    </div>
  </main>
  <script type="module" src="/static/knowledge.js"></script>
</body>
</html>
